<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>輕音樂，水晶音樂</title>
    <style>
        * {
            text-align: center;
            font: 40px sans-serif;
        }
        
        body {
            padding: 0;
            margin: 10px;
        }
        
        .I {
            image-rendering: pixelated;
        }
    </style>
</head>

<body>
    <button id="B" onclick="T();" style="display: block;"></button>
    <button id="R1" onclick="R(0);" style="display: block;">水晶音樂</button>
    <button id="R2" onclick="R(1);" style="display: block;">療癒冥想</button>
    <audio src="S1.mp3" id="S"></audio>
    <img src="play.png" class="I" id="PI">
    <img src="stop.png" class="I" id="SI">
</body>
<script>
    "use strict";
    const B = document.getElementById('B');
    const S = document.getElementById('S');
    const PI = document.getElementById('PI')
    const SI = document.getElementById('SI')
    var P = false;

    function T() {
        P = !P;
        B.innerHTML = '';
        if (P) {
            S.play();
            B.appendChild(SI);
        } else {
            S.pause();
            B.appendChild(PI);
        };
    };

    function R(N) {
        S.src = `S${N+1}.mp3`
        P = false;
        T();
    };

    function resize() {
        let BS = 200;
        B.style.width = `${BS}px`;
        B.style.height = `${BS}px`;
        SI.style.width = `${BS - 20}px`;
        SI.style.height = `${BS - 20}px`;
        PI.style.width = `${BS - 20}px`;
        PI.style.height = `${BS - 20}px`;
    };

    T();
    T();
    resize();

    document.addEventListener('resize', resize);
</script>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>輕音樂，水晶音樂</title>
    <style>
        html {
            --width: 200px;
        }
        
        * {
            text-align: center;
            font: 40px sans-serif;
        }
        
        body {
            padding: 0;
            margin: 10px;
        }
        
        .I {
            image-rendering: pixelated;
        }
        
        .B {
            display: inline-block;
            width: var(--width);
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <button id="B" onclick="T();" class="B"></button><br>
    <button id="R1" onclick="R(0);" class="B">水晶音樂</button><br>
    <button id="R2" onclick="R(1);" class="B">療癒冥想</button><br>
    <button id="R3" onclick="R(2);" class="B">涼涼</button><br>
    <a href="S4.html"><button id="R4"class="B">無字的情批</button></a><br>
    <audio src="S1.mp3" id="S"></audio>
    <img src="play.png" class="I" id="PI">
    <img src="stop.png" class="I" id="SI">
</body>
<script>
    "use strict";
    const B = document.getElementById('B');
    const S = document.getElementById('S');
    const PI = document.getElementById('PI')
    const SI = document.getElementById('SI')
    var P = false;

    function T() {
        P = !P;
        B.innerHTML = '';
        if (P) {
            S.play();
            B.appendChild(SI);
        } else {
            S.pause();
            B.appendChild(PI);
        };
    };

    function R(N) {
        S.src = `S${N+1}.mp3`
        P = false;
        T();
    };

    function resize() {
        let BS = 200;
        B.style.width = `${BS}px`;
        B.style.height = `${BS}px`;
        SI.style.width = `${BS - 20}px`;
        SI.style.height = `${BS - 20}px`;
        PI.style.width = `${BS - 20}px`;
        PI.style.height = `${BS - 20}px`;
    };

    T();
    T();
    resize();

    document.addEventListener('resize', resize);

    S.addEventListener('ended', function() {
        S.play();
    })
</script>

</html>

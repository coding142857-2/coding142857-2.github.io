<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png">
</head>

<body>
    <div id="tool-bar" class="onBar">
        <div class="tools ltr-box">
            <div class="text-left text-en">
                code
            </div>
            <div class="text-right">
                <input type="text" value="00022E0961912FF000000FF000000000000000000000000000000FF000000FF1117F" title="code" id="TA0">
            </div>
        </div>
        <hr>
        <!---->
        <div class="tools ltr-box">
            <div class="text-left text-ch">
                種子
            </div>
            <div class="text-right">
                <input type="number" min="0" max="4294967296" value="0" title="0 ~ 4294967296" id="TB0">
            </div>
        </div>
        <div class="tools ltr-box">
            <div class="text-left text-ch">
                大小
            </div>
            <div class="text-right">
                <input type="number" min="4" max="7" value="6" title="4 ~ 7" id="TB1">
            </div>
        </div>
        <div class="tools ltr-box">
            <div class="text-left text-ch">
                粗糙度
            </div>
            <div class="text-right">
                <input type="number" min="0" max="50" value="30" title="10 ~ 50" id="TB2">
            </div>
        </div>
        <div class="tools ltr-box">
            <div class="text-left text-ch">
                平滑度
            </div>
            <div class="text-right">
                <input type="number" min="0" max="5" value="1" title="1 ~ 3" id="TB3">
            </div>
        </div>
        <hr>
        <!---->
        <div class="tools ltr-box">
            <div class="text-left text-ch">
                模板
            </div>
            <div class="text-right">
                <input type="number" min="0" max="4" value="2" title="0 ~ 4" id="TC0">
            </div>
        </div>
        <div class="tools matrix-box" aria-label="5" id="matrix"></div>
        <div class="tools ltr-box">
            <div class="text-left text-ch">
                高度
            </div>
            <div class="text-right">
                <input type="number" min="-125" max="125" value="0" title="-125 ~ 125" id="TC1">
            </div>
        </div>
        <div class="tools ltr-box">
            <div class="text-left text-ch">
                隨機
            </div>
            <div class="text-right">
                <div class="checkbox" id="TC2"> </div>
            </div>
        </div>
        <div class="tools ltr-box">
            <div class="text-left text-ch">
                連續
            </div>
            <div class="text-right">
                <div class="checkbox" id="TC3"> </div>
            </div>
        </div>
        <hr>
        <!---->
        <div class="tools ltr-box">
            <div class="text-left text-ch">
                海岸線
            </div>
            <div class="text-right">
                <div class="checkbox" id="TD0"> </div>
            </div>
        </div>
        <div class="tools ltr-box">
            <div class="text-left text-ch">
                等高線
            </div>
            <div class="text-right">
                <div class="checkbox" id="TD1"> </div>
            </div>
        </div>
        <div class="tools ltr-box">
            <div class="text-left text-ch">
                邊框
            </div>
            <div class="text-right">
                <div class="checkbox" id="TD2"> </div>
            </div>
        </div>
        <div class="tools ltr-box">
            <div class="text-left text-ch">
                海平面
            </div>
            <div class="text-right">
                <input type="number" min="-25" max="25" value="0" title="-25 ~ 25" id="TD3">
            </div>
        </div>
    </div>
    <div id="tool-control" class="onBar"></div>
    <div id="map-ground" class="onBar">
        <canvas class="full" id="screen"></canvas>
        <div id="reload" onclick="run = false;"></div>
    </div>
</body>
<script src="script.js"></script>
<script src="iframe.js"></script>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>speedUp</title>
    <style>
        * {
            background: #000;
            color: #fff;
        }
        
        #start {
            display: block;
            position: fixed;
            font-size: 50px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        
        #info {
            display: block;
            position: fixed;
            font-size: 50px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            width: 100%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-shadow: 0 0 10px;
        }
        
        @keyframes beatKick {
            0% {
                transform: translate(-50%, -50%) scale(1.22);
                filter: brightness(1.4);
            }
            40% {
                transform: translate(-50%, -50%) scale(0.97);
                filter: brightness(1.1);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                filter: brightness(1);
            }
        }
        
        .kick {
            animation: beatKick var(--beat-dur, 461.54ms) cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        #index {
            display: block;
            position: fixed;
            font-size: 20px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            left: 0;
            top: 0;
        }
        
        #speed {
            display: block;
            position: fixed;
            font-size: 20px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            right: 0;
            top: 0;
            border: none;
        }
    </style>
</head>

<body>
    <span id="index"></span>
    <button id="start">start</button>
    <span id="info"></span>
    <input type="number" min="10" max="500" value="461.538461538" id="speed" step="5">
    <audio src="./track0.mp3" id="audio" style="display:none;"></audio>
</body>

        "specific|特定的",
        "stadium|運動場；體育場",
        "statue|雕像",
        "steady|不變的；穩定的",
        "substance|物質",
        "suffer|受苦",
        "supply|供給量",
        "surround|圍繞",
        "surroundings|環境",
        "symbol|象徵",
        "symbolic|作為象徵的；象徵性的",
        "symbolize|象徵；代表",
        "tap|（常指連續）輕敲，輕拍，輕觸",
        "temporary|短暫的；暫時的",
        "toast|烤；烘",
        "tourism|旅遊業；觀光業",
        "tourist|遊客",
        "trade|行業",
        "treatment|對待；待遇",
        "trial|試用",
        "trumpet|小號；小喇叭",
        "unfair|不公正的；不公平的",
        "unique|獨特的",
        "variety|種種；各式各樣",
        "vary|有所不同",
        "vitamin|維他命；維生素",
        "wealthy|富有的",
        "wrap|用...包／裹／圍",
        "yearly|整年的；每年的；一年一次的"
    ];
    var count = -1;
    var tick = 0;
    var rate = 461.538461538;
    var run;
    var eng;
    var colors = ['#f77', '#f97', '#ff7', '#7f7', '#7ff', '#97f', '#f7f'];
    var info = document.getElementById('info');
    var index = document.getElementById('index');
    var audio = document.getElementById('audio');
    var track = 0;
    var btn = document.getElementById('start');
    document.getElementById('speed').addEventListener('input', e => {
        rate = e.target.value - 0;
        info.style.setProperty('--beat-dur', rate + 'ms');
    })

    function task() {
        info.innerHTML = '';
        info.innerHTML += '<span style="color: ' + colors[count % colors.length] + ';">' + eng.slice(0, tick + 1) + '</span>';
        info.innerHTML += eng.slice(tick + 1);
        info.innerHTML += '<br>';
        info.innerHTML += '<span style="color: ' + colors[count % colors.length] + ';">' + dictionary[count].split('|')[1] + '</span>';
        index.innerText = count + ' - ' + tick;
        tick++;
        if (tick < eng.length) setTimeout(task, rate / eng.length - 1);
    }

    function step() {
        info.classList.remove('kick');
        void info.offsetWidth;
        info.classList.add('kick');
        count++;
        if (count === dictionary.length) count = 0;
        eng = dictionary[count].split('|')[0];
        tick = 0;
        task();
    }

    var now;

    function loop() {
        if (performance.now() - now > rate) {
            now += rate;
            step();
        }
        requestAnimationFrame(loop);
    }

    btn.addEventListener('click', e => {
        now = performance.now() + 700;
        setTimeout(loop, 700);
        audio.play();
        btn.remove();
    });



    audio.addEventListener('ended', e => {
        audio.src = './track' + (track = ++track % 9) + '.mp3';
        audio.play();
    })
</script>

</html>
